[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dicef"
version = "0.1.0"
description = "Dual-stage imaging learning and clinical evidence fusion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Liangliang Han" }]
maintainers = [{ name = "Liangliang Han" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.6,<1.7",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
nifti = ["nibabel>=5.2,<6"]

[project.scripts]
dicef = "dicef.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dicef = ["py.typed"]
